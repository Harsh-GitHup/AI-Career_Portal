[project]
name = "ai-career-portal"
version = "0.1.0"
description = "AI-powered career intelligence platform for students and professionals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "celery>=5.4.0",
    "dj-database-url>=3.1.2",
    "django>=5.1.0,<6.0.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.15.0",
    "google-auth>=2.58.0",
    "google-genai>=0.1.0",
    "gunicorn>=26.2.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=1.0.5",
    "mysqlclient>=2.2.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.7.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.4",
    "requests>=2.31.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "whitenoise>=6.12.0",
    "waitress>=3.0.2",
]

[tool.ruff.lint]
ignore = ["RUF012"]
